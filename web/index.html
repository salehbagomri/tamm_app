<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>تمّ | خدمات التكييف والطاقة الشمسية</title>
  <meta name="description" content="تمّ — منصة متكاملة لخدمات التكييف والطاقة الشمسية. تسوق المكيفات والألواح الشمسية واطلب خدمات التركيب والصيانة.">
  <meta name="keywords" content="تكييف, طاقة شمسية, مكيفات, ألواح شمسية, صيانة, تركيب, تمّ">

  <!-- Open Graph -->
  <meta property="og:title" content="تمّ | خدمات التكييف والطاقة الشمسية">
  <meta property="og:description" content="منصة متكاملة لخدمات التكييف والطاقة الشمسية">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-192.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="تمّ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="manifest" href="manifest.json">

  <!-- Loading screen styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E27;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0A0E27 0%, #111640 100%);
      font-family: 'Harmattan', serif;
      direction: rtl;
    }
    .loading-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .loading-text {
      margin-top: 24px;
      font-size: 20px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .loading-dots {
      display: inline-block;
      animation: dots 1.5s steps(3, end) infinite;
      width: 1.5em;
      text-align: left;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    @keyframes dots {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }
    .loading-dots::after {
      content: '';
      animation: dots-content 1.5s steps(3, end) infinite;
    }
    @keyframes dots-content {
      0% { content: ''; }
      33% { content: '.'; }
      66% { content: '..'; }
      100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <img class="loading-logo" src="icons/Icon-192.png" alt="تمّ" onerror="this.style.display='none'">
    <div class="loading-text">جاري تحميل تمّ<span class="loading-dots"></span></div>
  </div>

  <script>
    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
